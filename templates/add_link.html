{% extends 'base.html' %}

{% block title %}
Add Link | LinkNest
{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-header">

        <p class="dashboard-eyebrow">
            YOUR PERSONAL LIBRARY
        </p>

        <h1>Add to your Nest</h1>

        <p>
            Save something worth remembering.
        </p>

    </div>


    <form method="POST" class="link-form">

        {% csrf_token %}


        <div class="form-field">

            <label for="title">
                Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Django Documentation"
                required
            >

        </div>


        <div class="form-field">

            <label for="url">
                URL
            </label>

            <input
                type="url"
                id="url"
                name="url"
                placeholder="https://example.com"
                required
            >

        </div>


        <div class="form-field">

            <label for="category">
                Category
            </label>

            <select
                id="category"
                name="category"
            >

                <option value="github">GitHub</option>
                <option value="youtube">YouTube</option>
                <option value="documentation">Documentation</option>
                <option value="article">Article</option>
                <option value="leetcode">LeetCode</option>
                <option value="tool">Tool</option>
                <option value="other">Other</option>

            </select>

        </div>


        <div class="form-field">

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                rows="5"
                placeholder="What makes this useful?"
            ></textarea>

        </div>


        <label class="checkbox-label">

            <input
                type="checkbox"
                name="is_favourite"
            >

            <span>
                ⭐ Add to favourites
            </span>

        </label>


        <div class="form-actions">

            <button
                type="submit"
                class="primary-button"
            >
                Save Link
            </button>

            <a
                href="{% url 'dashboard' %}"
                class="secondary-button"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
