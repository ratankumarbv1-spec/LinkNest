{% extends 'base.html' %}

{% block title %}
Edit Link | LinkNest
{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-header">

        <p class="dashboard-eyebrow">
            YOUR PERSONAL LIBRARY
        </p>

        <h1>Edit Link</h1>

        <p>
            Update your saved resource.
        </p>

    </div>


    <form
        method="POST"
        class="link-form"
    >

        {% csrf_token %}


        <label for="title">
            Title
        </label>

        <input
            type="text"
            id="title"
            name="title"
            value="{{ link.title }}"
            required
        >


        <label for="url">
            URL
        </label>

        <input
            type="url"
            id="url"
            name="url"
            value="{{ link.url }}"
            required
        >


        <label for="category">
            Category
        </label>

        <select
            id="category"
            name="category"
        >

            <option value="github"
                {% if link.category == 'github' %}
                    selected
                {% endif %}
            >
                GitHub
            </option>

            <option value="youtube"
                {% if link.category == 'youtube' %}
                    selected
                {% endif %}
            >
                YouTube
            </option>

            <option value="documentation"
                {% if link.category == 'documentation' %}
                    selected
                {% endif %}
            >
                Documentation
            </option>

            <option value="article"
                {% if link.category == 'article' %}
                    selected
                {% endif %}
            >
                Article
            </option>

            <option value="leetcode"
                {% if link.category == 'leetcode' %}
                    selected
                {% endif %}
            >
                LeetCode
            </option>

            <option value="tool"
                {% if link.category == 'tool' %}
                    selected
                {% endif %}
            >
                Tool
            </option>

            <option value="other"
                {% if link.category == 'other' %}
                    selected
                {% endif %}
            >
                Other
            </option>

        </select>


        <label for="description">
            Description
        </label>

        <textarea
            id="description"
            name="description"
            rows="5"
        >{{ link.description }}</textarea>


        <label class="checkbox-label">

            <input
                type="checkbox"
                name="is_favourite"

                {% if link.is_favourite %}
                    checked
                {% endif %}
            >

            ⭐ Favourite

        </label>


        <div class="form-actions">

            <button
                type="submit"
                class="primary-button"
            >
                Save Changes
            </button>

            <a
                href="{% url 'dashboard' %}"
                class="secondary-button"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
